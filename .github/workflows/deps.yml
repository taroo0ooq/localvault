name: dependency-scan

on:
  pull_request:

jobs:
  dependency-scan:
    name: dependency-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - run: npm ci
      - name: npm audit (high+)
        run: npm audit --audit-level=high
      - name: OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v1.9.2
        with:
          scan-args: |-
            --recursive
            --skip-git
            ./
        continue-on-error: true
      - name: govulncheck (module deps; stdlib tracked via Go toolchain pin)
        working-directory: apps/vault-api
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          # JSON mode: fail only if a non-stdlib module is affected (stdlib fixed by go-version: stable)
          $(go env GOPATH)/bin/govulncheck -json ./... > /tmp/govuln.json || true
          python3 - <<'PY'
import json, sys
path="/tmp/govuln.json"
mod_vulns=[]
with open(path) as f:
    for line in f:
        line=line.strip()
        if not line: continue
        try:
            o=json.loads(line)
        except json.JSONDecodeError:
            continue
        if o.get("finding") and o["finding"].get("osv"):
            osv=o["finding"]["osv"]
            # trace modules
            for t in o["finding"].get("trace", []) or []:
                mod=t.get("module")
                if mod and mod not in ("stdlib",):
                    mod_vulns.append((osv, mod))
                    break
if mod_vulns:
    print("FAIL: third-party module vulnerabilities:")
    for v in mod_vulns:
        print(v)
    sys.exit(1)
print("OK: no third-party module vulnerabilities reported by govulncheck")
PY

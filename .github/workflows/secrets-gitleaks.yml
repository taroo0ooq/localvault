name: secrets-gitleaks

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  secrets-gitleaks:
    name: secrets-gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Use official binary (gitleaks-action needs extra permissions/license on some repos) — issue #8
      - name: Install gitleaks
        run: |
          curl -sSL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Gitleaks detect
        run: gitleaks detect --source . --verbose --redact --config .gitleaks.toml

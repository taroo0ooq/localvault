name: dast-zap

on:
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  push:
    branches: [main, develop]

jobs:
  dast-zap:
    name: dast-zap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start vault-api (compose.ci)
        run: |
          docker compose -f deploy/docker/compose.ci.yml up -d --build
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8443/healthz; then
              echo "healthy"
              exit 0
            fi
            sleep 2
          done
          echo "vault-api failed to become healthy"
          docker compose -f deploy/docker/compose.ci.yml logs
          exit 1
      - name: OWASP ZAP baseline
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "http://127.0.0.1:8443"
          rules_file_name: "tests/dast/zap-rules.tsv"
          cmd_options: "-a"
          allow_issue_writing: false
          fail_action: true
        continue-on-error: false
      - name: Upload ZAP artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline
          path: report_html.html
          if-no-files-found: ignore
      - name: Tear down
        if: always()
        run: docker compose -f deploy/docker/compose.ci.yml down -v

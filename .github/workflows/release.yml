name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  release-gate:
    name: release-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Unit tests (Go)
        working-directory: apps/vault-api
        run: go test ./...

      - name: Unit tests (JS workspaces)
        run: |
          npm ci
          npm test

      - name: Build vault-api binaries
        working-directory: apps/vault-api
        run: |
          mkdir -p dist
          GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.buildVersion=${GITHUB_REF_NAME}" -o dist/localvault-api-linux-amd64 ./cmd/server
          GOOS=linux   GOARCH=arm64 go build -trimpath -ldflags="-s -w -X main.buildVersion=${GITHUB_REF_NAME}" -o dist/localvault-api-linux-arm64 ./cmd/server
          GOOS=darwin  GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.buildVersion=${GITHUB_REF_NAME}" -o dist/localvault-api-darwin-amd64 ./cmd/server
          GOOS=darwin  GOARCH=arm64 go build -trimpath -ldflags="-s -w -X main.buildVersion=${GITHUB_REF_NAME}" -o dist/localvault-api-darwin-arm64 ./cmd/server
          # Windows: PE metadata + ZIP package (bare .exe trips Defender heuristics)
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="$VERSION" bash ../../deploy/windows/build-windows-host.sh "$PWD/dist/windows-host"
          cp dist/windows-host/LocalVault-Host-windows-amd64-v*.zip dist/
          # Keep a renamed exe only inside the zip; do not publish bare unsigned .exe as top-level asset
          (cd dist && sha256sum localvault-api-* LocalVault-Host-windows-amd64-v*.zip > SHA256SUMS)

      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          path: apps/vault-api
          format: spdx-json
          output-file: apps/vault-api/dist/sbom-vault-api.spdx.json

      - name: Build Docker image
        run: |
          docker build -f deploy/docker/Dockerfile.vault-api -t localvault-api:${{ github.ref_name }} apps/vault-api
          docker save localvault-api:${{ github.ref_name }} | gzip > apps/vault-api/dist/localvault-api-image-${{ github.ref_name }}.tar.gz
          (cd apps/vault-api/dist && sha256sum localvault-api-image-${{ github.ref_name }}.tar.gz >> SHA256SUMS)

      - name: Cosign sign (keyless OIDC when available)
        continue-on-error: true
        uses: sigstore/cosign-installer@v3
      - name: Cosign blob signatures
        continue-on-error: true
        env:
          COSIGN_YES: "true"
        run: |
          if command -v cosign >/dev/null; then
            for f in apps/vault-api/dist/localvault-api-*; do
              [ -f "$f" ] || continue
              case "$f" in
                *.json|*.tar.gz|SHA256SUMS) continue ;;
              esac
              cosign sign-blob --yes --bundle "${f}.cosign.bundle" "$f" || true
            done
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            apps/vault-api/dist/localvault-api-linux-amd64
            apps/vault-api/dist/localvault-api-linux-arm64
            apps/vault-api/dist/localvault-api-darwin-amd64
            apps/vault-api/dist/localvault-api-darwin-arm64
            apps/vault-api/dist/LocalVault-Host-windows-amd64-v*.zip
            apps/vault-api/dist/SHA256SUMS
            apps/vault-api/dist/sbom-vault-api.spdx.json
            apps/vault-api/dist/localvault-api-image-*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: release

on:
  push:
    tags:
      - "v*"

jobs:
  release-gate:
    name: release-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require CI green before release artifacts
        run: |
          echo "Release workflow scaffold (S1)."
          echo "Full signed artifacts + SBOM in S8."
          echo "Tag: ${{ github.ref_name }}"

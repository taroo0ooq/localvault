name: e2e-playwright

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  e2e-playwright:
    name: e2e-playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - run: npm ci

      - name: Validate tunnel compose (S4)
        run: sh deploy/scripts/validate-compose.sh

      - name: Start vault-api
        working-directory: apps/vault-api
        run: |
          go build -o /tmp/vault-api ./cmd/server
          VAULT_LISTEN=127.0.0.1:8443 \
          VAULT_DB=/tmp/vault-e2e.db \
          VAULT_TUNNEL_MODE=1 \
          VAULT_PUBLIC_BASE_URL=http://127.0.0.1:9443 \
            /tmp/vault-api &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8443/healthz && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8443/healthz

      - name: Start tunnel-edge simulator
        working-directory: apps/tunnel-edge
        run: |
          go build -o /tmp/tunnel-edge .
          EDGE_LISTEN=127.0.0.1:9443 EDGE_UPSTREAM=http://127.0.0.1:8443 /tmp/tunnel-edge &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9443/healthz && exit 0
            sleep 1
          done
          exit 1

      - name: Install Playwright browsers
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright (API + remote pair)
        working-directory: tests/e2e
        env:
          VAULT_BASE_URL: http://127.0.0.1:8443
          EDGE_BASE_URL: http://127.0.0.1:9443
        run: npx playwright test --grep-invert "web enrollment"

      - name: Build web client
        run: npm run build --workspace=@localvault/web

      - name: Start web preview
        run: |
          npm run preview --workspace=@localvault/web &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:5173/ && exit 0
            sleep 1
          done
          exit 1

      - name: Run Playwright (web enrollment)
        working-directory: tests/e2e
        env:
          VAULT_BASE_URL: http://127.0.0.1:8443
          WEB_BASE_URL: http://127.0.0.1:5173
          RUN_WEB_E2E: "1"
        run: npx playwright test specs/web-enroll.spec.ts

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: tests/e2e/test-results/
          if-no-files-found: ignore

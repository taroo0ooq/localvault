name: Bug report
description: File a bug found during testing (REQ-013)
title: "[bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options: [critical, high, medium, low]
    validations:
      required: true
  - type: input
    id: stage
    attributes:
      label: Stage id
      placeholder: S8
    validations:
      required: true
  - type: input
    id: req
    attributes:
      label: Requirement id
      placeholder: REQ-012
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        Fix branch naming: `fix/<issue-number>-slug`  
        Same CI gates as feature PRs (REQ-012).

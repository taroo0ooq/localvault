name: Bug report
description: File a bug found in testing (Playwright, ZAP, QA). Required before fix work.
title: "[bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options: [critical, high, medium, low]
    validations:
      required: true
  - type: input
    id: stage
    attributes:
      label: Stage (e.g. S2)
      placeholder: S1
    validations:
      required: true
  - type: input
    id: req_ids
    attributes:
      label: Requirement IDs
      placeholder: REQ-020
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: CI / Docker Desktop / browser

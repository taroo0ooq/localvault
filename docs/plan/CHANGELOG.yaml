# Plan changelog — every plan amendment must append here
meta:
  document: plan-changelog

entries:
  - version: "1.2.0"
    date: "2026-07-30"
    type: amendment
    amendment_id: AMD-002
    summary: >
      Multiuser isolated vaults on one Docker host (REQ-020). Locked enrollment order:
      simple username → PIN create/confirm → app-generated recovery passphrase.
      ADRs 011–012. No shared vaults/org admin in v1.
    author: grok-build / plan-amendment
    new_requirements: [REQ-020]
    updated_requirements: [REQ-011]

  - version: "1.1.0"
    date: "2026-07-30"
    type: amendment
    amendment_id: AMD-001
    summary: >
      Cross-device Argon2id profiles; app-generated recovery passphrase at enrollment;
      WebAuthn platform + hardware-key (PRF) unlock ladder; guided CSV import for Google
      Password Manager and Apple Passwords/iCloud. ADRs 007–010. See 06-plan-amendment-v1.1.0.yaml.
    author: grok-build / plan-amendment
    new_requirements: [REQ-015, REQ-016, REQ-017, REQ-018, REQ-019]

  - version: "1.0.0"
    date: "2026-07-30"
    type: initial
    summary: Initial master plan, architecture, CI/CD gates, security model, roadmap, requirements matrix for LocalVault.
    author: grok-build / stage-S0
